name: "PPU Runner Verification (t-head)"

on:
  workflow_dispatch:
    inputs:
      test_scenario:
        description: "测试场景"
        required: true
        type: choice
        options:
          - single-card
          - multi-card
          - all

env:
  IMAGE: "reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.9.0-ubuntu24.04-cuda13.0-sglang0.5.10-py312-ppu202605281910"
  NAMESPACE: "ppu-sched"
  COMMAND: >-
    echo '=== PPU Runner Verification (t-head) ==='
    && echo "Hostname: $(hostname), Node: $NODE_NAME"
    && echo "RANK=$RANK WORLD_SIZE=$WORLD_SIZE NNODES=$NNODES NPROC_PER_NODE=$NPROC_PER_NODE MASTER_ADDR=$MASTER_ADDR"
    && echo '--- ppu-smi ---'
    && ppu-smi
    && echo '--- source dir ---'
    && ls -la /workspace/source
    && echo '--- NAS mounts ---'
    && ls /nas_aisw
    && ls /mnt/wl_nas
    && echo '=== DONE ==='

jobs:
  test-single-card:
    if: ${{ inputs.test_scenario == 'single-card' || inputs.test_scenario == 'all' }}
    runs-on: [self-hosted, k8s-runner-group-cpu-thead]
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: "单卡验证 (1 PPU)"
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=ZW-M890P"
          image: ${{ env.IMAGE }}
          command: ${{ env.COMMAND }}
          namespace: ${{ env.NAMESPACE }}
          timeout_minutes: 10

  test-multi-card:
    if: ${{ inputs.test_scenario == 'multi-card' || inputs.test_scenario == 'all' }}
    runs-on: [self-hosted, k8s-runner-group-cpu-thead]
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: "多卡验证 (8 PPU)"
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          nnodes: 0
          nproc_per_node: 8
          node_selector: "board-type=ZW-M890P"
          image: ${{ env.IMAGE }}
          command: ${{ env.COMMAND }}
          namespace: ${{ env.NAMESPACE }}
          timeout_minutes: 10
