name: FlashMLA temporary wheel upload

# Build a wheel, run the check-in suite, then publish it to a temporary directory.
# Publishing is gated on the suite; a failure keeps the wheel as an artifact only.
# fast: compile only. The check-in suite and its summary are skipped and the
# staged wheel is published as is.
# The build defaults to the triggering ref; target_ref builds a PR URL, a branch
# name, a release tag (x.y.z+va.b.c) or a commit id instead.
# Requires RELEASE_USERNAME / RELEASE_TOKEN secrets (TEMPLATE_TOKEN for private templates).
on:
  # 19:30 Asia/Shanghai daily (cron is UTC).
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      matrix:
        description: "Board matrix as a JSON array; one wheel comes from the first leg"
        required: false
        type: string
        default: '["ZW-M890P"]'
      target_ref:
        description: "FlashMLA-for-sail PR URL, branch name, release tag (x.y.z+va.b.c) or commit id. Empty builds the triggering ref."
        required: false
        type: string
        default: ''
      sail_image:
        description: "Container image for the build/test pod. Empty uses the default image pinned in the test workflow."
        required: false
        type: string
        default: ''
      fast:
        description: 'Compile only: skip the check-in suite and its summary, keep the staged wheel.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Runs for different targets must not cancel each other.
concurrency:
  group: flashmla-ut-upload-tmp-${{ inputs.target_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    # Reuse the check-in workflow for build and suite; its wheel is the artifact
    # that gets published.
    uses: ./.github/workflows/flashmla-ut-test-ppu.yml
    with:
      matrix: ${{ inputs.matrix || '["ZW-M890P"]' }}
      sail_image: ${{ inputs.sail_image }}
      target_ref: ${{ inputs.target_ref }}
      fast: ${{ inputs.fast }}

  merge:
    name: Merge board wheel artifacts
    # needs gates on build-test, so a failed suite never reaches the push job.
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.artifact_name }}
      repo: ${{ needs.build-test.outputs.repo }}
      commit: ${{ needs.build-test.outputs.commit }}
      branch: ${{ needs.build-test.outputs.branch }}
      tag: ${{ needs.build-test.outputs.tag }}
    steps:
      - name: Set merged artifact name
        id: artifact-name
        shell: bash
        run: |
          echo "artifact_name=flashmla-wheels-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Merge wheel artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: ${{ steps.artifact-name.outputs.artifact_name }}
          pattern: flashmla-wheel-${{ github.run_id }}-${{ github.run_attempt }}-*
          compression-level: 0
          delete-merged: false

  push:
    name: Call temporary wheel upload template
    needs: merge
    uses: t-head/ci-infra/.github/workflows/push-tmp-wheel.yml@main
    with:
      # run_attempt moves when only the publishing job is rerun.
      artifact_name: ${{ needs.merge.outputs.artifact_name }}
      repo: ${{ needs.merge.outputs.repo }}
      commit: ${{ needs.merge.outputs.commit }}
      branch: ${{ needs.merge.outputs.branch }}
      tag: ${{ needs.merge.outputs.tag }}
      template_repository: t-head/ci-infra
      template_ref: main
    secrets:
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
      template_token: ${{ secrets.TEMPLATE_TOKEN }}

  result:
    name: Show batch directory URL
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write to logs and job summary
        shell: bash
        env:
          UPLOAD_URL: ${{ needs.push.outputs.upload_url }}
        run: |
          set -euo pipefail
          printf 'Batch directory: %s\n' "$UPLOAD_URL" | tee -a "$GITHUB_STEP_SUMMARY"
