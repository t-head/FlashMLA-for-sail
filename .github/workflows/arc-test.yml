# .github/workflows/arc-test.yml
name: ARC Scaling Test

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: "job 容器镜像"
        default: "reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.9.0-ubuntu24.04-cuda13.0-sglang0.5.10-py312-ppu202605281910"

jobs:
  test-ppu1:
    runs-on: k8s-runner-group-ppu1
    container:
      image: ${{ inputs.image || 'reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.9.0-ubuntu24.04-cuda13.0-sglang0.5.10-py312-ppu202605281910' }}
    steps:
      - name: PPU 1卡测试
        run: |
          echo "PPU 1卡测试"
          hostname
          ppu-smi

  test-ppu2:
